spring.application.name=ecocarbon-backend
spring.profiles.active=dev

# Server Port (Render & Railway inject PORT environment variable)
server.port=${PORT:8080}

# Common JWT configuration
jwt.secret=${JWT_SECRET:carbon_footprint_assistant_secret_2026_xyz_enterprise_secure_token}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ecocarbon.netlify.app}

